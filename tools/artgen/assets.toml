# The open pack's art, rendered by artgen.py from these prompts alone.
#
# Each [[asset]] is one pack ID: its file in the pack, a seed and a
# prompt.  "size" is in 640x480 pixels (default the full screen); the
# art is rendered at that size times art_height / 480.  Prompts describe
# the layout the game's screen needs: where its text and sprites go.
#
# People: describe every person in a picture on their own (age, build,
# face, hair or hat, clothes); "three sailors" gives three copies of one
# face.

[pack]
name = "flibustier open pack (photographic, draft)"
license = "undecided: draft art, not for release"
art_height = 1080
# Appended to every prompt, so all pictures share one look.
style = """
Style: one consistent look for the whole series, photographed like a
period film still of the 1660s Caribbean, natural warm light, gentle
film grain, muted rich colours with warm amber and deep teal tones,
moderate contrast, shallow depth of field, realistic textures, no text.
"""
# Framed renders are cut by this share of their size on every side, as
# the model tends to leave some wall around the frame; an asset's own
# "trim" overrides it, framed or not.
frame_trim = 0.04
# The board a screen's title is written on (an asset's "plaque" =
# [x, y, w, h] in 640x480 pixels): rendered alone and placed there.
plaque = """
Photograph, straight on, of a single plain plank of pale cream painted
wood filling the whole image edge to edge, its paint smooth and slightly
worn, with a thin darker edge along its border; no lettering, no marks,
no nails in the middle. Even soft light.
"""
# Appended to the prompt of every framed asset.
framed = """
The photograph is mounted in an ornate antique gilded wooden picture
frame that fills the whole image edge to edge, no wall around it.
"""

# The governor's audience: his text is drawn at x 320-620 from y 150 in
# a light ink, so the right half must be dark and plain.
[[asset]]
id = "pic/governor"
file = "art/governor.png"
seed = 1660
grade = false		# the grade's reference
prompt = """
A single continuous photograph of one room: a colonial governor's study
in the Caribbean in the 1660s, seen from the doorway. A stern governor
in period dress, a long dark wig, a brocade coat with lace cravat, sits
behind a heavy carved wooden desk with papers, a quill and a brass
candlestick, placed in the left third of the picture. The candle on the
desk is the only light: it lights the governor warmly, and the same
wood-panelled wall continues to the right, fading gradually into deep
shadow, plain and empty, filling the right half of the picture.
Historical reenactment photography, 35mm lens, natural textures, sharp
focus, realistic.
"""
negative = """
split screen, diptych, two panels, collage, vertical dividing line,
text, letters, watermark, signature, frame, border, cartoon,
illustration, painting, 3d render, lowres, blurry, deformed
"""

# The log book: text over x 140-560, y 20-400 in a dark ink, so the
# pages must reach the top of the picture (the date is at y 20); page-turn
# arrows at (200-240, 420-450) and (380-420, 420-450) and a bookmark at
# (0-100, 360-479) are parts of the picture.
[[asset]]
id = "pic/shiplog"
file = "art/shiplog.png"
seed = 1660
prompt = """
Close-up photograph from straight above of a single blank page of an old
ship's log book, the page of cream laid paper filling almost the whole
picture from the top edge to the bottom edge, completely empty with no
writing. Along the left edge, a narrow strip of the book's binding and
the edges of the other pages; along the right edge, a narrow strip of
the red leather cover. A faded red ribbon bookmark lies across the
bottom left corner of the page. Warm even candlelight, realistic paper
grain, sharp focus, realistic.
"""
# The Ship's Log page turns its leaves at these two spots, so they show
# page-turn buttons, placed exactly: one button drawn, the other its
# mirror, both cut round.
[[asset.pieces]]
rect = [200, 420, 40, 30]
mask = "layouts/round.png"
prompt = """
Photograph, straight on, of one round worn brass button seen from the
front, a perfect circle filling the whole image from edge to edge, with a
bold arrow pointing to the left engraved in its middle, warm soft light.
"""
[[asset.pieces]]
rect = [380, 420, 40, 30]
mirror = 0
mask = "layouts/round.png"

# The people who appear in several pictures, described once: a prompt's
# "{name}" becomes the description, word for word.
[characters]
bartender = """
the tavern keeper, a tall, rough working man in his forties with short
dark hair and a few days' stubble, a faded red shirt with sweat stains
and rolled sleeves, a long apron of coarse linen, grimy and stained
with wine and grease
"""
barmaid = """
the barmaid, a young full-figured woman in her late twenties with a
round face, a broad warm smile, a generous bust, long dark curly hair and
small gold earrings, a low-cut white
off-shoulder blouse, a tight black laced bodice and a long red skirt
"""
mapman = """
the map seller, an old man with a long grey beard and a patterned
headscarf, a worn yellow-brown coat
"""
infoman = """
the informant, a shady man in his forties with a dark beard and a
turban-like headscarf, a black waistcoat over a white shirt
"""
sailor_old = """
an old weathered sailor with a white beard and a green turban, a rough
shirt
"""
sailor_young = """
a young clean-shaven sailor with curly brown hair and a red neckerchief,
a rough shirt
"""
sailor_big = """
a broad dark-skinned sailor in his forties with a shaved head, a short
black beard and a gold earring, a rough shirt
"""

# One colour grade for every picture: its colours are pulled towards the
# reference picture's (an approved one of the pack), then a touch of
# contrast.  The reference itself is rendered without the grade.
[grade]
reference = "art/governor.png"
method = "reinhard_lab"
strength = 0.5
contrast = 1.05

