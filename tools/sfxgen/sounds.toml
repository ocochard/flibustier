# The open pack's sound effects, for tools/sfxgen/sfxgen.py.
#
# Each sound is rendered from its text prompt alone, never from the
# original's sounds, so the result carries no original data.  "length"
# is the original's length as heard (within 20 dB of its peak, the FM
# effects' faint release left out), which the result is cut to (its leading
# silence trimmed, its end faded); "seconds", what the model is asked
# for, is a little longer so that the sound is not cut short.  The IDs are the engine's (asset-packs.md, "Replacement
# sounds").
#
# No voices: the model cannot speak or shout, a voice prompt comes out as
# vocal noise.  The sounds that are voices in the original (the hail's
# "Arrgh!", the harbour's call, the lookout's "Sail ho!", the land
# battle's "En garde!", the cries of the hit in sword fights, the beaten
# opponent's surrender)
#
#
# The model is Stable Audio 3 since the crash and the splash came out
# wrong with Stable Audio Open 1.0.
# are left out, so the game keeps the original's; the other sounds are
# asked without voices.

# Stable Audio 3 Small-SFX (distilled): 8 steps at CFG 1 as its model card
# says; its "pingpong" sampler, which re-noises at each step, is
# euler_ancestral in ComfyUI.  (Stable Audio Open 1.0 took 100 steps of
# dpmpp_3m_sde_gpu, exponential, at CFG 7, with t5_base.)
[render]
checkpoint = "stable_audio_3_small_sfx.safetensors"
text_encoder = "t5gemma_b_b_ul2.safetensors"
steps = 8
cfg = 1.0
sampler = "euler_ancestral"
scheduler = "simple"
negative = "music, melody, singing, speech, voice, vocals, shouting, screaming, talking, low quality, distorted, noise, hiss, static"

# The digitised effects (DIGITAL.PIR's) that are not voices.

[[sound]]
id = "sound/broadside"
length = 1.46
seconds = 2
prompt = "a ship's broadside, several heavy old cannons firing in quick succession at sea, deep booms, rolling echo"

[[sound]]
id = "sound/parry"
length = 0.45
seconds = 1
prompt = "two steel swords clashing once, a sharp metallic ring"

[[sound]]
id = "sound/shot-hit"
length = 1.19
seconds = 1.7
prompt = "an iron cannonball striking a thick wooden ship's hull, one hard heavy impact and a splintering crack"

[[sound]]
id = "sound/shot-miss"
length = 1.01
seconds = 1.5
prompt = "a heavy iron ball plunging into the sea, a loud water splash and spray, waves"

[[sound]]
id = "sound/crash"
length = 1.64
seconds = 2.1
prompt = "a heavy wooden ship ramming into another, one deep hollow crunch of thick oak timbers, then a creak"

[[sound]]
id = "sound/swing"
length = 0.51
seconds = 1
prompt = "a sword swung fast through the air, a short whoosh"

[[sound]]
id = "sound/blow"
length = 0.19
seconds = 1
prompt = "a blade striking a wooden shield, a dull thud"

[[sound]]
id = "sound/miss"
length = 1.01
seconds = 1.5
