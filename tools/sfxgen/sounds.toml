# The open pack's sound effects, for tools/sfxgen/sfxgen.py.
#
# Each sound is rendered from its text prompt alone, never from the
# original's sounds, so the result carries no original data.  "length"
# is the original's length, which the result is cut to (its leading
# silence trimmed, its end faded); "seconds", what the model is asked
# for, is a little longer so that the sound is not cut short.  The IDs are the engine's (asset-packs.md, "Replacement
# sounds").
#
# No voices: the model cannot speak or shout, a voice prompt comes out as
# vocal noise.  The sounds that are voices in the original (the hail's
# "Arrgh!", the harbour's call, the land battle's "En garde!", the
# cries of the hit in sword fights)
# are left out, so the game keeps the original's; the other sounds are
# asked without voices.

[render]
checkpoint = "stable-audio-open-1.0.safetensors"
text_encoder = "t5_base.safetensors"
steps = 100
cfg = 7.0
sampler = "dpmpp_3m_sde_gpu"
scheduler = "exponential"
negative = "music, melody, singing, speech, voice, vocals, shouting, screaming, talking, low quality, distorted, noise, hiss, static"

# The digitised effects (DIGITAL.PIR's nine).

[[sound]]
id = "sound/broadside"
length = 1.46
seconds = 2
prompt = "a ship's broadside, several heavy old cannons firing in quick succession at sea, deep booms, rolling echo"

