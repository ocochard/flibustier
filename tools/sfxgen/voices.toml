# The open pack's voices, for tools/sfxgen/voicegen.py.
#
# The sound effects that are voices in the original, spoken anew by Dia2
# (Nari Labs, Apache 2.0) from the lines below alone: never from the
# original's recordings.  [S1] is the speaker; Dia2 also reads
# non-verbal cues such as (screams), (groans), (gasps).  "length" is the
# original's; a take longer than 1.5 times that is cut, a shorter one is
# kept whole.  "recorded" marks a line a person recorded instead (CC0,
# see its provenance): voicegen.py never renders over it.

# Without a reference, Dia2 picks a new speaker for every take (women,
# singing...).  "voice", on the GPU host, gives every line one low male
# voice: 10 s from 0:40 of chapters 1-2 of LibriVox's public-domain
# Treasure Island, read by Squiddhartha ("voice_source").
[render]
repo = "nari-labs/Dia2-2B"
cfg = 2.0
temperature = 0.8
voice = "ref/pirate.wav"
voice_source = "https://archive.org/download/treasureisland_librivox/treasure_island_01-02_stevenson_64kb.mp3 (0:40-0:50; LibriVox, public domain)"

[[voice]]
id = "sound/hail"
length = 0.89
text = "[S1] Arrgh!"
recorded = true

[[voice]]
id = "sound/sail-ho"
length = 1.15
text = "[S1] Sail ho!"
recorded = true

[[voice]]
id = "sound/harbour"
length = 1.04
text = "[S1] (shouts) Laaand hooo!"
recorded = true

[[voice]]
id = "sound/land-battle"
length = 0.81
text = "[S1] En garde!"
recorded = true

[[voice]]
id = "sound/last-man"
length = 0.97
text = "[S1] Oh! I surrender!"
recorded = true

[[voice]]
id = "sound/hit-foe"
length = 0.52
text = "[S1] Argh! (groans)"
recorded = true

[[voice]]
id = "sound/hit-you"
length = 0.37
text = "[S1] Ugh! (gasps)"
recorded = true
